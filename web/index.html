<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta
      name="google-signin-client_id"
      content="907402131431-pqiaudv68qea3uufo7ectug6cnst58uf.apps.googleusercontent.com"
    />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="TeamManagement web app for teams, surveys, shifts, and clocking."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TeamManagement" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>TeamManagement</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --tm-bg: #111118;
        --tm-bg-soft: #1a1a28;
        --tm-primary: #6b3fe8;
        --tm-primary-strong: #7c4dff;
        --tm-text: #f8f6ff;
        --tm-text-soft: rgba(248, 246, 255, 0.68);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 50% 34%, rgba(124, 77, 255, 0.34), transparent 26%),
          radial-gradient(circle at 50% 58%, rgba(107, 63, 232, 0.16), transparent 32%),
          linear-gradient(180deg, var(--tm-bg-soft), var(--tm-bg));
        overflow: hidden;
      }

      body {
        font-family: Nunito, Arial, sans-serif;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      body.app-loaded #app-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .tm-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transform: translateY(-10px);
      }

      .tm-bars {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tm-bars span {
        height: 6px;
        border-radius: 999px;
        background: rgba(124, 77, 255, 0.28);
        box-shadow: 0 0 16px rgba(124, 77, 255, 0.18);
        animation: tm-bar 1.25s infinite ease-in-out;
      }

      .tm-bars span:nth-child(1) {
        width: 40px;
        animation-delay: 0s;
      }

      .tm-bars span:nth-child(2) {
        width: 34px;
        animation-delay: 0.14s;
      }

      .tm-bars span:nth-child(3) {
        width: 28px;
        animation-delay: 0.28s;
      }

      .tm-bars span:nth-child(4) {
        width: 22px;
        animation-delay: 0.42s;
      }

      .tm-mark-wrap {
        position: relative;
        width: 184px;
        height: 156px;
        display: grid;
        place-items: center;
      }

      .tm-mark-glow {
        position: absolute;
        inset: 18% 12%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 77, 255, 0.48), rgba(124, 77, 255, 0));
        filter: blur(16px);
        animation: tm-pulse 2s infinite ease-in-out;
      }

      .tm-mark {
        position: relative;
        width: 138px;
        height: 138px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(124, 77, 255, 0.22));
        animation: tm-float 2.2s infinite ease-in-out;
      }

      .tm-word {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
        color: var(--tm-text);
        font-size: 52px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-shadow: 0 0 16px rgba(124, 77, 255, 0.2);
      }

      .tm-word span {
        display: inline-block;
        animation: tm-letter 1.6s infinite ease-in-out;
      }

      .tm-word span:nth-child(1) { animation-delay: 0s; }
      .tm-word span:nth-child(2) { animation-delay: 0.12s; }
      .tm-word span:nth-child(3) { animation-delay: 0.24s; }
      .tm-word span:nth-child(4) { animation-delay: 0.36s; }

      .tm-subline {
        display: flex;
        align-items: center;
        gap: 16px;
        color: rgba(200, 182, 255, 0.9);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.52em;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(124, 77, 255, 0.25);
      }

      .tm-subline::before,
      .tm-subline::after {
        content: "";
        width: 64px;
        height: 2px;
        border-radius: 999px;
        background: rgba(160, 130, 255, 0.82);
        box-shadow: 0 0 10px rgba(124, 77, 255, 0.2);
      }

      .tm-subline span {
        display: inline-block;
        animation: tm-subletter 1.8s infinite ease-in-out;
      }

      .tm-hint {
        color: var(--tm-text-soft);
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      @keyframes tm-bar {
        0%, 100% {
          background: rgba(124, 77, 255, 0.24);
          transform: scaleX(0.92);
        }
        40% {
          background: rgba(124, 77, 255, 0.94);
          transform: scaleX(1.08);
        }
      }

      @keyframes tm-pulse {
        0%, 100% { transform: scale(0.94); opacity: 0.62; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes tm-float {
        0%, 100% { transform: translateY(0) scale(0.985); }
        50% { transform: translateY(-5px) scale(1.015); }
      }

      @keyframes tm-letter {
        0%, 100% {
          transform: translateY(0) scaleX(1) scaleY(1);
          opacity: 0.82;
        }
        35% {
          transform: translateY(-7px) scaleX(1.12) scaleY(0.92);
          opacity: 1;
        }
        65% {
          transform: translateY(5px) scaleX(0.92) scaleY(1.08);
          opacity: 0.88;
        }
      }

      @keyframes tm-subletter {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.74;
        }
        50% {
          transform: translateY(-2px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <div class="tm-loader">
        <div class="tm-bars">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="tm-mark-wrap">
          <div class="tm-mark-glow"></div>
          <img
            id="tm-loader-logo"
            class="tm-mark"
            src="assets/assets/images/logo.png"
            alt="TeamManagement logo"
          />
        </div>
        <div class="tm-word">
          <span>T</span>
          <span>E</span>
          <span>A</span>
          <span>M</span>
        </div>
        <div class="tm-subline">
          <span>MANAGEMENT</span>
        </div>
        <div class="tm-hint">Loading workspace...</div>
      </div>
    </div>
    <script>
      (function () {
        var logo = document.getElementById("tm-loader-logo");
        if (!logo) return;

        var logoCandidates = [
          "assets/assets/images/logo.png",
          "assets/images/logo.png",
          "assets/assets/images/team_management_logo.svg",
          "assets/images/team_management_logo.svg",
        ];

        function loadCandidate(index) {
          if (index >= logoCandidates.length) return;

          logo.onerror = function () {
            loadCandidate(index + 1);
          };
          logo.src = logoCandidates[index];
        }

        loadCandidate(0);
      })();

      window.addEventListener("flutter-first-frame", function () {
        document.body.classList.add("app-loaded");
        window.setTimeout(function () {
          var loader = document.getElementById("app-loader");
          if (loader) loader.remove();
        }, 260);
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
