org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Force Gradle to use Android Studio's bundled JDK 21 instead of the system
# Java 25 runtime, which breaks the current Android/Gradle toolchain.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
android.enableJetifier=true

# Ottimizzazioni velocita build
# Daemon Gradle: mantiene il processo JVM in vita tra le build
org.gradle.daemon=true
# Build parallela: compila i moduli indipendenti in parallelo
org.gradle.parallel=true
# Caching: riusa gli output delle build precedenti
org.gradle.caching=true
